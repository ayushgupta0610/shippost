[project]
name = "shippost"
version = "0.1.0"
description = "Turn your git commits into a creative build-in-public X post."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "typer>=0.20.0",
    "rich>=14.0.0",
    "openai>=2.41.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.0",
    "pyperclip>=1.9.0",
]

[project.scripts]
shippost = "shippost.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pyright>=1.1.409",
    "ruff>=0.15.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["shippost", "tests"]
typeCheckingMode = "standard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
